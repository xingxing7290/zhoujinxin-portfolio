name: One-time privacy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[privacy-cleanup]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_IMAGE_TAG: sha-cf4b3f2
    steps:
      - name: Remove historical runs, artifacts, and container versions
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          package="${repo#*/}"
          current="$GITHUB_RUN_ID"

          runs_json="$(gh api --paginate --slurp "repos/$repo/actions/runs?per_page=100")"
          jq -r --argjson current "$current" \
            '.[] .workflow_runs[] | select(.id != $current and (.status == "queued" or .status == "in_progress")) | .id' \
            <<<"$runs_json" | while read -r run_id; do
              gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" --silent || true
            done

          for _ in $(seq 1 12); do
            active="$(gh api --paginate --slurp "repos/$repo/actions/runs?per_page=100" | \
              jq --argjson current "$current" '[.[] .workflow_runs[] | select(.id != $current and (.status == "queued" or .status == "in_progress"))] | length')"
            [ "$active" -eq 0 ] && break
            sleep 5
          done

          versions_json="$(gh api --paginate --slurp "/users/$owner/packages/container/$package/versions?per_page=100")"
          keep_count="$(jq --arg keep "$KEEP_IMAGE_TAG" '[.[][] | select((.metadata.container.tags // []) | index($keep))] | length' <<<"$versions_json")"
          if [ "$keep_count" -eq 0 ]; then
            echo "Refusing package cleanup: protected image tag was not found."
            exit 1
          fi
          jq -r --arg keep "$KEEP_IMAGE_TAG" '.[][] | select(((.metadata.container.tags // []) | index($keep)) | not) | .id' \
            <<<"$versions_json" | while read -r version_id; do
              gh api --method DELETE "/users/$owner/packages/container/$package/versions/$version_id" --silent
            done

          gh api --paginate --slurp "repos/$repo/actions/artifacts?per_page=100" \
            | jq -r '.[] .artifacts[] | .id' \
            | while read -r artifact_id; do
                gh api --method DELETE "repos/$repo/actions/artifacts/$artifact_id" --silent || true
              done

          gh api --paginate --slurp "repos/$repo/actions/runs?per_page=100" \
            | jq -r --argjson current "$current" '.[] .workflow_runs[] | select(.id != $current) | .id' \
            | while read -r run_id; do
                gh api --method DELETE "repos/$repo/actions/runs/$run_id" --silent || true
              done
